name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer les tests
        run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image
        run: docker build -t suivi-candidatures .

      - name: Démarrer le conteneur et vérifier qu'il répond
        run: |
          docker run -d --name app -p 8000:8000 suivi-candidatures
          for i in $(seq 1 15); do
            if curl -fs http://localhost:8000/sante; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker logs app
          exit 1
